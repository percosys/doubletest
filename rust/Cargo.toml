[package]
name = "stl2cad"
version = "0.1.0"
edition = "2021"
description = "Deterministic STL -> parametric CAD plan (fast core for the Fusion add-in)"

[lib]
name = "stl2cad"
path = "src/lib.rs"

[[bin]]
name = "stl2cad-worker"
path = "src/bin/worker.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
i_overlay = "1"
earcutr = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
